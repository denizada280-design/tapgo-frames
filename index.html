<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>TapVia NFC</title>

<style>

:root{
  --bg:#ffffff;
  --fg:#222222;
  --accent:#e6005c;
}


/* =====================================================
   RESET
   ===================================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}


html,
body{

  width:100%;
  height:100%;

  margin:0;
  padding:0;

  background:#ffffff;

  color:var(--fg);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Inter",
    Arial,
    sans-serif;

  overflow-x:hidden;
}


/* =====================================================
   ANA ALAN
   ===================================================== */

.scroll-section{

  position:relative;

  width:100%;

  height:100vh;

  min-height:650px;

  background:#ffffff;

  overflow:hidden;
}


.sticky-wrap{

  position:relative;

  width:100%;
  height:100%;

  background:#ffffff;

  overflow:hidden;
}


/* =====================================================
   CANVAS
   ===================================================== */

#sequence-canvas{

  position:absolute;

  top:50%;

  left:auto;

  right:3mm;

  transform:
    translateY(-50%);

  height:96vh;

  width:auto;

  max-width:none;

  aspect-ratio:478 / 850;

  display:block;

  background:#ffffff;
}


/* =====================================================
   PROGRESS BAR
   ===================================================== */

.scroll-progress-track{

  position:absolute;

  bottom:40px;

  left:50%;

  transform:
    translateX(-50%);

  width:
    min(
      60%,
      320px
    );

  height:3px;

  background:
    rgba(
      0,
      0,
      0,
      .16
    );

  border-radius:3px;

  overflow:hidden;

  z-index:10;
}


.scroll-progress-fill{

  width:0%;

  height:100%;

  background:#e6005c;
}


/* =====================================================
   KAYDIR
   ===================================================== */

.scroll-hint{

  position:absolute;

  bottom:60px;

  left:50%;

  transform:
    translateX(-50%);

  font-size:13px;

  font-weight:600;

  letter-spacing:.12em;

  text-transform:uppercase;

  color:#222222;

  opacity:1;

  z-index:10;

  white-space:nowrap;

  animation:
    bob 1.8s ease-in-out infinite;
}


@keyframes bob{

  0%,
  100%{

    transform:
      translate(-50%,0);

  }

  50%{

    transform:
      translate(-50%,5px);

  }

}


/* =====================================================
   PRELOADER
   ===================================================== */

#preload-overlay{

  position:fixed;

  inset:0;

  z-index:9999;

  width:100%;
  height:100%;

  background:#ffffff;

  display:flex;

  align-items:center;

  justify-content:center;

  opacity:1;

  visibility:visible;

  transition:
    opacity .5s ease,
    visibility .5s ease;
}


#preload-overlay.hidden{

  opacity:0;

  visibility:hidden;

  pointer-events:none;
}


.preload-bar-track{

  width:200px;

  height:2px;

  background:
    rgba(
      0,
      0,
      0,
      .12
    );

  border-radius:2px;

  overflow:hidden;
}


.preload-bar-fill{

  width:0%;

  height:100%;

  background:#e6005c;
}


/* =====================================================
   MOBİL
   ===================================================== */

@media(max-width:700px){

  .scroll-section{

    min-height:600px;

  }


  #sequence-canvas{

    right:3mm;

    height:90vh;

  }


  .scroll-progress-track{

    width:65%;

    bottom:34px;

    height:3px;

  }


  .scroll-hint{

    bottom:54px;

    font-size:12px;

  }

}

</style>
</head>


<body>


<!-- =====================================================
     PRELOADER
     ===================================================== -->

<div id="preload-overlay">

  <div class="preload-bar-track">

    <div
      class="preload-bar-fill"
      id="preload-bar-fill">
    </div>

  </div>

</div>


<!-- =====================================================
     MAIN
     ===================================================== -->

<section
  id="story"
  class="scroll-section">

  <div class="sticky-wrap">


    <!-- FRAME -->

    <canvas
      id="sequence-canvas">
    </canvas>


    <!-- PROGRESS -->

    <div
      class="scroll-progress-track">

      <div
        class="scroll-progress-fill"
        id="progress-fill">
      </div>

    </div>


    <!-- KAYDIR -->

    <div class="scroll-hint">
      KAYDIR
    </div>


  </div>

</section>


<script>

(() => {

  "use strict";


  /* =====================================================
     CONFIG
     ===================================================== */

  const CONFIG = {

    frameFolder: ".",


    framePrefix:
      "ezgif-frame-",


    frameExt:
      "jpg",


    frameCount:
      110,


    padLength:
      3,


    background:
      "#ffffff",


    ease:
      0.08

  };


  /* =====================================================
     DOM
     ===================================================== */

  const canvas =
    document.getElementById(
      "sequence-canvas"
    );


  const ctx =
    canvas.getContext(
      "2d"
    );


  const progressFill =
    document.getElementById(
      "progress-fill"
    );


  const preloadOverlay =
    document.getElementById(
      "preload-overlay"
    );


  const preloadBarFill =
    document.getElementById(
      "preload-bar-fill"
    );


  /* =====================================================
     FRAME URL
     ===================================================== */

  function frameUrl(
    index
  ){

    const number =
      String(
        index + 1
      ).padStart(
        CONFIG.padLength,
        "0"
      );


    return (
      CONFIG.frameFolder +
      "/" +
      CONFIG.framePrefix +
      number +
      "." +
      CONFIG.frameExt
    );

  }


  /* =====================================================
     IMAGES
     ===================================================== */

  const images =
    new Array(
      CONFIG.frameCount
    );


  let loadedCount =
    0;


  /* =====================================================
     PRELOAD
     ===================================================== */

  function preloadFrames(){

    return new Promise(
      (resolve)=>{

        for(
          let i=0;
          i<CONFIG.frameCount;
          i++
        ){

          const img =
            new Image();


          img.src =
            frameUrl(i);


          img.onload =
            ()=>{

              loadedCount++;


              const percent =
                Math.round(
                  (
                    loadedCount /
                    CONFIG.frameCount
                  ) * 100
                );


              if(
                preloadBarFill
              ){

                preloadBarFill.style.width =
                  percent + "%";

              }


              if(
                loadedCount ===
                CONFIG.frameCount
              ){

                resolve();

              }

            };


          img.onerror =
            ()=>{

              console.warn(
                "Frame yüklenemedi:",
                img.src
              );


              loadedCount++;


              const percent =
                Math.round(
                  (
                    loadedCount /
                    CONFIG.frameCount
                  ) * 100
                );


              if(
                preloadBarFill
              ){

                preloadBarFill.style.width =
                  percent + "%";

              }


              if(
                loadedCount ===
                CONFIG.frameCount
              ){

                resolve();

              }

            };


          images[i] =
            img;

        }

      }
    );

  }


  /* =====================================================
     CANVAS
     ===================================================== */

  let dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );


  let currentFrame =
    0;


  let targetFrame =
    0;


  let frameProgress =
    0;


  function resizeCanvas(){

    dpr =
      Math.min(
        window.devicePixelRatio || 1,
        2
      );


    const rect =
      canvas.getBoundingClientRect();


    canvas.width =
      Math.round(
        rect.width *
        dpr
      );


    canvas.height =
      Math.round(
        rect.height *
        dpr
      );


    ctx.setTransform(
      dpr,
      0,
      0,
      dpr,
      0,
      0
    );


    drawFrame(
      Math.round(
        currentFrame
      )
    );

  }


  /* =====================================================
     DRAW FRAME
     ===================================================== */

  function drawFrame(
    frameIndex
  ){

    const clamped =
      Math.min(
        Math.max(
          frameIndex,
          0
        ),
        images.length - 1
      );


    const img =
      images[
        clamped
      ];


    if(
      !img ||
      !img.complete ||
      img.naturalWidth === 0
    ){

      return;

    }


    const rect =
      canvas.getBoundingClientRect();


    const cw =
      rect.width;


    const ch =
      rect.height;


    /*
      BEYAZ ARKA PLAN
    */

    ctx.fillStyle =
      CONFIG.background;


    ctx.fillRect(
      0,
      0,
      cw,
      ch
    );


    /*
      YÜKSEK KALİTE
    */

    ctx.imageSmoothingEnabled =
      true;


    ctx.imageSmoothingQuality =
      "high";


    /*
      COVER
    */

    const imageRatio =
      img.naturalWidth /
      img.naturalHeight;


    const canvasRatio =
      cw /
      ch;


    let drawWidth;
    let drawHeight;
    let x;
    let y;


    if(
      canvasRatio >
      imageRatio
    ){

      drawWidth =
        cw;


      drawHeight =
        cw /
        imageRatio;


      x =
        0;


      y =
        (
          ch -
          drawHeight
        ) / 2;

    }

    else{

      drawHeight =
        ch;


      drawWidth =
        ch *
        imageRatio;


      x =
        (
          cw -
          drawWidth
        ) / 2;


      y =
        0;

    }


    ctx.drawImage(
      img,
      x,
      y,
      drawWidth,
      drawHeight
    );

  }


  /* =====================================================
     PROGRESS
     ===================================================== */

  const WHEEL_SENSITIVITY =
    0.0016;


  function applyProgress(
    value
  ){

    frameProgress =
      Math.min(
        Math.max(
          value,
          0
        ),
        1
      );


    targetFrame =
      frameProgress *
      (
        CONFIG.frameCount - 1
      );


    if(
      progressFill
    ){

      progressFill.style.width =
        (
          frameProgress *
          100
        ) + "%";

    }

  }


  /* =====================================================
     WHEEL
     ===================================================== */

  function onCanvasWheel(
    event
  ){

    event.preventDefault();


    applyProgress(
      frameProgress +
      event.deltaY *
      WHEEL_SENSITIVITY
    );

  }


  /* =====================================================
     ANIMATION
     ===================================================== */

  function animate(){

    const diff =
      targetFrame -
      currentFrame;


    if(
      Math.abs(diff) >
      0.01
    ){

      currentFrame +=
        diff *
        CONFIG.ease;

    }

    else{

      currentFrame =
        targetFrame;

    }


    drawFrame(
      Math.round(
        currentFrame
      )
    );


    requestAnimationFrame(
      animate
    );

  }


  /* =====================================================
     INIT
     ===================================================== */

  async function init(){

    window.addEventListener(
      "resize",
      resizeCanvas,
      {
        passive:true
      }
    );


    canvas.addEventListener(
      "wheel",
      onCanvasWheel,
      {
        passive:false
      }
    );


    resizeCanvas();


    await preloadFrames();


    drawFrame(
      0
    );


    applyProgress(
      0
    );


    animate();


    /*
      PRELOADER KAPAT
    */

    if(
      preloadOverlay
    ){

      preloadOverlay.classList.add(
        "hidden"
      );


      setTimeout(
        ()=>{
          
          if(
            preloadOverlay
          ){

            preloadOverlay.remove();

          }

        },
        600
      );

    }

  }


  init();

})();

</script>

</body>
</html>
