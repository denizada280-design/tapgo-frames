<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Tapgo 3D Model</title>

<style>

:root {
  --bg:#0e0e0e;
  --fg:#f5f5f0;
  --accent:#d4ff4f;
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body {
  background:var(--bg);
  color:var(--fg);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Inter",
    Arial,
    sans-serif;

  overflow-x:hidden;
}

.scroll-section {
  position:relative;
  height:100vh;
  background:var(--bg);
}

.sticky-wrap {
  position:relative;
  height:100%;
  width:100%;
  overflow:hidden;
  background:var(--bg);
}


/* =========================================================
   FRAME CANVAS
   ========================================================= */

#sequence-canvas {

  position:absolute;

  top:50%;
  left:50%;

  transform:
    translate(-50%, -50%);

  height:92vh;

  width:auto;

  max-width:94vw;

  aspect-ratio:478 / 850;

  display:block;

  background:var(--bg);
}


/* =========================================================
   SCROLL PROGRESS
   ========================================================= */

.scroll-progress-track {

  position:absolute;

  bottom:32px;
  left:50%;

  transform:
    translateX(-50%);

  width:
    min(60%,320px);

  height:2px;

  background:
    rgba(
      255,
      255,
      255,
      .15
    );

  border-radius:2px;

  overflow:hidden;

  z-index:5;
}

.scroll-progress-fill {

  height:100%;

  width:0%;

  background:
    var(--accent);
}


/* =========================================================
   SCROLL HINT
   ========================================================= */

.scroll-hint {

  position:absolute;

  bottom:48px;
  left:50%;

  transform:
    translateX(-50%);

  font-size:11px;

  letter-spacing:.15em;

  text-transform:uppercase;

  opacity:.5;

  z-index:5;

  animation:
    bob 1.8s ease-in-out infinite;
}


@keyframes bob {

  0%,
  100% {

    transform:
      translate(-50%,0);

  }

  50% {

    transform:
      translate(-50%,6px);

  }

}


/* =========================================================
   PRELOADER
   ========================================================= */

#preload-overlay {

  position:fixed;

  inset:0;

  z-index:999;

  background:
    var(--bg);

  display:flex;

  align-items:center;

  justify-content:center;

  transition:
    opacity .5s ease;
}


#preload-overlay
.preload-bar-track {

  width:200px;

  height:2px;

  background:
    rgba(
      255,
      255,
      255,
      .15
    );

  border-radius:2px;

  overflow:hidden;
}


#preload-overlay
.preload-bar-fill {

  height:100%;

  width:0%;

  background:
    var(--accent);
}


#preload-overlay.hidden {

  opacity:0;

  pointer-events:none;
}

</style>
</head>


<body>


<!-- =====================================================
     PRELOADER
     ===================================================== -->

<div id="preload-overlay">

  <div class="preload-bar-track">

    <div
      class="preload-bar-fill"
      id="preload-bar-fill">
    </div>

  </div>

</div>



<!-- =====================================================
     MAIN STORY
     ===================================================== -->

<section
  id="story"
  class="scroll-section">

  <div class="sticky-wrap">


    <!-- FRAME CANVAS -->

    <canvas
      id="sequence-canvas">
    </canvas>


    <!-- PROGRESS -->

    <div
      class="scroll-progress-track">

      <div
        class="scroll-progress-fill"
        id="progress-fill">
      </div>

    </div>


    <!-- HINT -->

    <div class="scroll-hint">
      Scroll
    </div>


  </div>

</section>



<script>

(() => {

  "use strict";


  /* =========================================================
     CONFIG
     ========================================================= */

  const CONFIG = {

    /*
      Frame'ler index.html ile AYNI klasörde.
    */

    frameFolder: ".",


    /*
      GitHub'daki dosya isimleri:

      ezgif-frame-001.jpg
      ezgif-frame-002.jpg
      ezgif-frame-003.jpg
      ...
      ezgif-frame-110.jpg
    */

    framePrefix:
      "ezgif-frame-",


    frameExt:
      "jpg",


    frameCount:
      110,


    /*
      001
      002
      003

      yani 3 hane
    */

    padLength:
      3,


    /*
      Arka plan
    */

    background:
      "#0e0e0e",


    /*
      Frame geçiş yumuşaklığı

      Daha küçük =
      daha akıcı

      Daha büyük =
      daha hızlı
    */

    ease:
      0.08

  };


  /* =========================================================
     DOM
     ========================================================= */

  const canvas =
    document.getElementById(
      "sequence-canvas"
    );


  const ctx =
    canvas.getContext(
      "2d"
    );


  const progressFill =
    document.getElementById(
      "progress-fill"
    );


  const preloadOverlay =
    document.getElementById(
      "preload-overlay"
    );


  const preloadBarFill =
    document.getElementById(
      "preload-bar-fill"
    );


  canvas.style.background =
    CONFIG.background;


  document.documentElement
    .style
    .setProperty(
      "--bg",
      CONFIG.background
    );


  /* =========================================================
     FRAME URL
     ========================================================= */

  function frameUrl(index) {

    /*
      index = 0

      sonuç:

      ezgif-frame-001.jpg
    */

    const number =
      String(index + 1)
        .padStart(
          CONFIG.padLength,
          "0"
        );


    return (

      CONFIG.frameFolder +

      "/" +

      CONFIG.framePrefix +

      number +

      "." +

      CONFIG.frameExt

    );

  }


  /* =========================================================
     IMAGE ARRAY
     ========================================================= */

  const images =
    new Array(
      CONFIG.frameCount
    );


  let loadedCount =
    0;


  /* =========================================================
     PRELOAD
     ========================================================= */

  function preloadFrames() {

    return new Promise(
      (resolve) => {

        for (
          let i = 0;
          i < CONFIG.frameCount;
          i++
        ) {

          const img =
            new Image();


          /*
            Örnek:

            ./ezgif-frame-001.jpg

            ./ezgif-frame-002.jpg

            ...
          */

          img.src =
            frameUrl(i);


          img.onload =
            () => {

              loadedCount++;


              const percent =
                Math.round(
                  (
                    loadedCount /
                    CONFIG.frameCount
                  ) * 100
                );


              if (
                preloadBarFill
              ) {

                preloadBarFill
                  .style
                  .width =
                  percent + "%";

              }


              if (
                loadedCount ===
                CONFIG.frameCount
              ) {

                resolve();

              }

            };


          img.onerror =
            () => {

              /*
                Eksik frame varsa
                konsola bildir.

                Ancak preload kilitlenmez.
              */

              console.warn(
                "Frame yüklenemedi:",
                img.src
              );


              loadedCount++;


              const percent =
                Math.round(
                  (
                    loadedCount /
                    CONFIG.frameCount
                  ) * 100
                );


              if (
                preloadBarFill
              ) {

                preloadBarFill
                  .style
                  .width =
                  percent + "%";

              }


              if (
                loadedCount ===
                CONFIG.frameCount
              ) {

                resolve();

              }

            };


          images[i] =
            img;

        }

      }
    );

  }


  /* =========================================================
     CANVAS SCALE
     ========================================================= */

  let dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );


  function resizeCanvas() {

    dpr =
      Math.min(
        window.devicePixelRatio || 1,
        2
      );


    const rect =
      canvas.getBoundingClientRect();


    canvas.width =
      Math.round(
        rect.width *
        dpr
      );


    canvas.height =
      Math.round(
        rect.height *
        dpr
      );


    ctx.setTransform(
      dpr,
      0,
      0,
      dpr,
      0,
      0
    );


    drawFrame(
      Math.round(
        currentFrame
      )
    );

  }


  /* =========================================================
     DRAW FRAME
     ========================================================= */

  function drawFrame(
    frameIndex
  ) {

    const clamped =
      Math.min(
        Math.max(
          frameIndex,
          0
        ),
        images.length - 1
      );


    const img =
      images[
        clamped
      ];


    /*
      Görsel yüklenmediyse
      çık.
    */

    if (
      !img ||
      !img.complete ||
      img.naturalWidth === 0
    ) {

      return;

    }


    const rect =
      canvas.getBoundingClientRect();


    const cw =
      rect.width;


    const ch =
      rect.height;


    /*
      ARKA PLAN
    */

    ctx.fillStyle =
      CONFIG.background;


    ctx.fillRect(
      0,
      0,
      cw,
      ch
    );


    /*
      SMOOTHING
    */

    ctx.imageSmoothingEnabled =
      true;


    ctx.imageSmoothingQuality =
      "high";


    /*
      COVER FIT

      Görsel canvas'ı
      tamamen kaplar.
    */

    const imageRatio =
      img.naturalWidth /
      img.naturalHeight;


    const canvasRatio =
      cw / ch;


    let drawWidth;
    let drawHeight;
    let drawX;
    let drawY;


    if (
      canvasRatio >
      imageRatio
    ) {

      drawWidth =
        cw;


      drawHeight =
        cw /
        imageRatio;


      drawX =
        0;


      drawY =
        (
          ch -
          drawHeight
        ) / 2;

    }

    else {

      drawHeight =
        ch;


      drawWidth =
        ch *
        imageRatio;


      drawY =
        0;


      drawX =
        (
          cw -
          drawWidth
        ) / 2;

    }


    ctx.drawImage(
      img,
      drawX,
      drawY,
      drawWidth,
      drawHeight
    );

  }


  /* =========================================================
     FRAME STATE
     ========================================================= */

  let frameProgress =
    0;


  let targetFrame =
    0;


  let currentFrame =
    0;


  /*
    Mouse wheel hassasiyeti.
  */

  const WHEEL_SENSITIVITY =
    0.0016;


  /* =========================================================
     APPLY PROGRESS
     ========================================================= */

  function applyProgress(
    progress
  ) {

    /*
      0 ile 1 arasında tut.
    */

    frameProgress =
      Math.min(
        Math.max(
          progress,
          0
        ),
        1
      );


    /*
      0 → 109 frame
    */

    targetFrame =
      frameProgress *
      (
        CONFIG.frameCount - 1
      );


    /*
      Progress bar
    */

    progressFill.style.width =
      (
        frameProgress *
        100
      ) + "%";

  }


  /* =========================================================
     MOUSE WHEEL
     ========================================================= */

  function onCanvasWheel(
    event
  ) {

    /*
      Canvas üzerinde
      scroll yapıldığında
      sayfa yerine frame ilerler.
    */

    event.preventDefault();


    applyProgress(
      frameProgress +
      event.deltaY *
      WHEEL_SENSITIVITY
    );

  }


  /* =========================================================
     ANIMATION LOOP
     ========================================================= */

  function animate() {

    const diff =
      targetFrame -
      currentFrame;


    if (
      Math.abs(diff) >
      0.01
    ) {

      currentFrame +=
        diff *
        CONFIG.ease;

    }

    else {

      currentFrame =
        targetFrame;

    }


    drawFrame(
      Math.round(
        currentFrame
      )
    );


    requestAnimationFrame(
      animate
    );

  }


  /* =========================================================
     INIT
     ========================================================= */

  async function init() {

    /*
      Window resize
    */

    window.addEventListener(
      "resize",
      resizeCanvas,
      {
        passive:true
      }
    );


    /*
      Canvas wheel
    */

    canvas.addEventListener(
      "wheel",
      onCanvasWheel,
      {
        passive:false
      }
    );


    /*
      Canvas boyutu
    */

    resizeCanvas();


    /*
      Tüm frameleri yükle
    */

    await preloadFrames();


    /*
      İlk frame
    */

    drawFrame(
      0
    );


    /*
      Başlangıç progress
    */

    applyProgress(
      0
    );


    /*
      Animasyon
    */

    animate();


    /*
      Loading kapat
    */

    preloadOverlay.classList.add(
      "hidden"
    );


    setTimeout(
      () => {

        if (
          preloadOverlay
        ) {

          preloadOverlay.remove();

        }

      },
      600
    );

  }


  init();

})();

</script>

</body>
</html>
