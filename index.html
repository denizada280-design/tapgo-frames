<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>TapVia NFC</title>

<style>

/* =========================================================
   ROOT
   ========================================================= */

:root{
  --bg:#ffffff;
  --fg:#222222;
  --accent:#e6005c;
}


/* =========================================================
   RESET
   ========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{

  width:100%;
  height:100%;

  margin:0;
  padding:0;

  background:#ffffff;

  color:var(--fg);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Inter",
    Arial,
    sans-serif;

  overflow:hidden;
}


/* =========================================================
   MAIN
   ========================================================= */

.scroll-section{

  position:relative;

  width:100%;
  height:100vh;

  min-height:650px;

  background:#ffffff;

  overflow:hidden;
}


.sticky-wrap{

  position:relative;

  width:100%;
  height:100%;

  background:#ffffff;

  overflow:hidden;
}


/* =========================================================
   PRODUCT CANVAS
   ========================================================= */

#sequence-canvas{

  position:absolute;

  top:50%;

  left:auto;

  /*
    Sağdan 1.5 mm
  */

  right:1.5mm;

  transform:
    translateY(-50%);

  /*
    BÜYÜK ÜRÜN
  */

  height:104vh;

  width:auto;

  max-width:none;

  aspect-ratio:478 / 850;

  display:block;

  background:#ffffff;

}


/* =========================================================
   DİKEY KAYDIRMA KONTROLÜ

   OK KARTIN SOLUNDA.
   KARTIN İÇİNDE DEĞİL.
   ========================================================= */

.tapvia-scroll-control{

  position:absolute;

  top:50%;

  /*
    Canvas genişliği:
    104vh * 478 / 850
    ≈ 58.47vh

    Kontrolü kartın soluna taşıyoruz.
  */

  right:
    calc(
      1.5mm +
      58.47vh +
      34px
    );

  transform:
    translateY(-50%);

  width:52px;

  height:58vh;

  min-height:320px;

  z-index:50;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  pointer-events:none;
}


/* =========================================================
   OK GÖVDESİ
   ========================================================= */

.tapvia-arrow{

  position:relative;

  width:8px;

  height:100%;

  background:
    rgba(
      230,
      0,
      92,
      .14
    );

  border-radius:10px;

}


/* =========================================================
   DOLAN OK
   ========================================================= */

.tapvia-arrow-fill{

  position:absolute;

  left:0;

  bottom:0;

  width:100%;

  height:0%;

  background:
    var(--accent);

  border-radius:10px;

}


/* =========================================================
   OK BAŞI - SABİT
   ========================================================= */

.tapvia-arrow-head{

  position:absolute;

  top:-1px;

  left:50%;

  transform:
    translateX(-50%);

  width:0;
  height:0;

  border-left:
    15px solid transparent;

  border-right:
    15px solid transparent;

  border-bottom:
    23px solid
    rgba(
      230,
      0,
      92,
      .18
    );
}


/* =========================================================
   OK BAŞI - DOLU
   ========================================================= */

.tapvia-arrow-head-fill{

  position:absolute;

  top:-1px;

  left:50%;

  transform:
    translateX(-50%);

  width:0;
  height:0;

  border-left:
    15px solid transparent;

  border-right:
    15px solid transparent;

  border-bottom:
    23px solid
    var(--accent);

  opacity:0;
}


/* =========================================================
   YÜZDE
   ========================================================= */

.tapvia-percent{

  position:absolute;

  left:50%;

  bottom:
    calc(
      100% + 10px
    );

  transform:
    translateX(-50%);

  color:#777777;

  font-size:10px;

  font-weight:600;

  letter-spacing:.08em;

  white-space:nowrap;
}


/* =========================================================
   KAYDIR
   ========================================================= */

.tapvia-scroll-label{

  position:absolute;

  left:50%;

  top:
    calc(
      100% + 15px
    );

  transform:
    translateX(-50%);

  color:#222222;

  font-size:12px;

  font-weight:700;

  letter-spacing:.14em;

  white-space:nowrap;

  text-transform:uppercase;
}


/* =========================================================
   PRELOADER
   ========================================================= */

#preload-overlay{

  position:fixed;

  inset:0;

  z-index:9999;

  width:100%;
  height:100%;

  background:#ffffff;

  display:flex;

  align-items:center;

  justify-content:center;

  opacity:1;

  visibility:visible;

  transition:
    opacity .5s ease,
    visibility .5s ease;
}


#preload-overlay.hidden{

  opacity:0;

  visibility:hidden;

  pointer-events:none;
}


.preload-bar-track{

  width:180px;

  height:2px;

  background:
    rgba(
      0,
      0,
      0,
      .12
    );

  overflow:hidden;

  border-radius:2px;
}


.preload-bar-fill{

  width:0%;

  height:100%;

  background:
    var(--accent);
}


/* =========================================================
   MOBİL
   ========================================================= */

@media(max-width:700px){

  .scroll-section{

    min-height:600px;

  }


  #sequence-canvas{

    right:1.5mm;

    height:94vh;

    max-width:none;

  }


  /*
    Mobilde canvas genişliği:
    94vh * 478 / 850
    ≈ 52.91vh
  */

  .tapvia-scroll-control{

    right:
      calc(
        1.5mm +
        52.91vh +
        24px
      );

    height:54vh;

    min-height:280px;

    width:40px;

  }


  .tapvia-arrow{

    width:7px;

  }


  .tapvia-arrow-head,
  .tapvia-arrow-head-fill{

    border-left-width:12px;

    border-right-width:12px;

    border-bottom-width:19px;

  }


  .tapvia-scroll-label{

    font-size:10px;

  }

}

</style>

</head>


<body>


<!-- =========================================================
     PRELOADER
     ========================================================= -->

<div id="preload-overlay">

  <div class="preload-bar-track">

    <div
      class="preload-bar-fill"
      id="preload-bar-fill">
    </div>

  </div>

</div>


<!-- =========================================================
     MAIN
     ========================================================= -->

<section
  id="story"
  class="scroll-section">


  <div class="sticky-wrap">


    <!-- =====================================================
         PRODUCT
         ===================================================== -->

    <canvas
      id="sequence-canvas">
    </canvas>


    <!-- =====================================================
         OUTSIDE VERTICAL ARROW
         ===================================================== -->

    <div
      class="tapvia-scroll-control"
      id="tapvia-scroll-control">


      <!-- PERCENT -->

      <div
        class="tapvia-percent"
        id="tapvia-percent">

        0%

      </div>


      <!-- ARROW -->

      <div class="tapvia-arrow">


        <!-- FILL -->

        <div
          class="tapvia-arrow-fill"
          id="tapvia-arrow-fill">
        </div>


        <!-- HEAD -->

        <div
          class="tapvia-arrow-head">
        </div>


        <!-- FILLED HEAD -->

        <div
          class="tapvia-arrow-head-fill"
          id="tapvia-arrow-head-fill">
        </div>


      </div>


      <!-- LABEL -->

      <div
        class="tapvia-scroll-label">

        KAYDIR

      </div>


    </div>


  </div>

</section>


<script>

(() => {

  "use strict";


  /* =====================================================
     CONFIG
     ===================================================== */

  const CONFIG = {

    /*
      GitHub'daki frame dosyaları
      index.html ile aynı klasörde.
    */

    frameFolder:
      ".",


    /*
      Dosya formatı:

      ezgif-frame-001.jpg
      ezgif-frame-002.jpg
      ...
      ezgif-frame-110.jpg
    */

    framePrefix:
      "ezgif-frame-",

    frameExt:
      "jpg",

    frameCount:
      110,

    padLength:
      3,


    /*
      Beyaz
    */

    background:
      "#ffffff",


    /*
      Smoothness
    */

    ease:
      0.08

  };


  /* =====================================================
     DOM
     ===================================================== */

  const canvas =
    document.getElementById(
      "sequence-canvas"
    );


  const ctx =
    canvas.getContext(
      "2d"
    );


  const progressFill =
    document.getElementById(
      "tapvia-arrow-fill"
    );


  const arrowHeadFill =
    document.getElementById(
      "tapvia-arrow-head-fill"
    );


  const percentLabel =
    document.getElementById(
      "tapvia-percent"
    );


  const preloadOverlay =
    document.getElementById(
      "preload-overlay"
    );


  const preloadBarFill =
    document.getElementById(
      "preload-bar-fill"
    );


  /* =====================================================
     FRAME URL
     ===================================================== */

  function frameUrl(index){

    const number =
      String(
        index + 1
      ).padStart(
        CONFIG.padLength,
        "0"
      );


    return (

      CONFIG.frameFolder +

      "/" +

      CONFIG.framePrefix +

      number +

      "." +

      CONFIG.frameExt

    );

  }


  /* =====================================================
     IMAGES
     ===================================================== */

  const images =
    new Array(
      CONFIG.frameCount
    );


  let loadedCount =
    0;


  /* =====================================================
     PRELOAD
     ===================================================== */

  function preloadFrames(){

    return new Promise(
      (resolve)=>{

        for(
          let i=0;
          i<CONFIG.frameCount;
          i++
        ){

          const img =
            new Image();


          img.src =
            frameUrl(i);


          img.onload =
            ()=>{

              loadedCount++;


              const percent =
                Math.round(
                  (
                    loadedCount /
                    CONFIG.frameCount
                  ) * 100
                );


              if(
                preloadBarFill
              ){

                preloadBarFill.style.width =
                  percent + "%";

              }


              if(
                loadedCount ===
                CONFIG.frameCount
              ){

                resolve();

              }

            };


          img.onerror =
            ()=>{

              console.warn(
                "Frame yüklenemedi:",
                img.src
              );


              loadedCount++;


              const percent =
                Math.round(
                  (
                    loadedCount /
                    CONFIG.frameCount
                  ) * 100
                );


              if(
                preloadBarFill
              ){

                preloadBarFill.style.width =
                  percent + "%";

              }


              if(
                loadedCount ===
                CONFIG.frameCount
              ){

                resolve();

              }

            };


          images[i] =
            img;

        }

      }
    );

  }


  /* =====================================================
     STATE
     ===================================================== */

  let currentFrame =
    0;

  let targetFrame =
    0;

  let progress =
    0;


  let dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );


  /* =====================================================
     RESIZE
     ===================================================== */

  function resizeCanvas(){

    dpr =
      Math.min(
        window.devicePixelRatio || 1,
        2
      );


    const rect =
      canvas.getBoundingClientRect();


    canvas.width =
      Math.round(
        rect.width *
        dpr
      );


    canvas.height =
      Math.round(
        rect.height *
        dpr
      );


    ctx.setTransform(
      dpr,
      0,
      0,
      dpr,
      0,
      0
    );


    drawFrame(
      Math.round(
        currentFrame
      )
    );

  }


  /* =====================================================
     DRAW FRAME
     ===================================================== */

  function drawFrame(
    frameIndex
  ){

    const index =
      Math.min(
        Math.max(
          frameIndex,
          0
        ),
        images.length - 1
      );


    const img =
      images[index];


    if(
      !img ||
      !img.complete ||
      img.naturalWidth === 0
    ){

      return;

    }


    const rect =
      canvas.getBoundingClientRect();


    const width =
      rect.width;


    const height =
      rect.height;


    /*
      WHITE BACKGROUND
    */

    ctx.fillStyle =
      CONFIG.background;


    ctx.fillRect(
      0,
      0,
      width,
      height
    );


    ctx.imageSmoothingEnabled =
      true;


    ctx.imageSmoothingQuality =
      "high";


    /*
      COVER FIT
    */

    const imageRatio =
      img.naturalWidth /
      img.naturalHeight;


    const canvasRatio =
      width /
      height;


    let drawWidth;
    let drawHeight;
    let x;
    let y;


    if(
      canvasRatio >
      imageRatio
    ){

      drawWidth =
        width;


      drawHeight =
        width /
        imageRatio;


      x =
        0;


      y =
        (
          height -
          drawHeight
        ) / 2;

    }

    else{

      drawHeight =
        height;


      drawWidth =
        height *
        imageRatio;


      x =
        (
          width -
          drawWidth
        ) / 2;


      y =
        0;

    }


    ctx.drawImage(
      img,
      x,
      y,
      drawWidth,
      drawHeight
    );

  }


  /* =====================================================
     PROGRESS
     ===================================================== */

  const WHEEL_SENSITIVITY =
    0.0016;


  function applyProgress(
    value
  ){

    progress =
      Math.min(
        Math.max(
          value,
          0
        ),
        1
      );


    targetFrame =
      progress *
      (
        CONFIG.frameCount - 1
      );


    /*
      Arrow fill:
      bottom → top
    */

    progressFill.style.height =
      (
        progress *
        100
      ) + "%";


    /*
      Percentage
    */

    percentLabel.textContent =
      Math.round(
        progress *
        100
      ) + "%";


    /*
      Arrow head
    */

    arrowHeadFill.style.opacity =
      progress > 0.01
        ? "1"
        : "0";

  }


  /* =====================================================
     WHEEL
     ===================================================== */

  function handleWheel(
    event
  ){

    /*
      Animasyonun üzerine gelince
      wheel hareketi frame değiştirir.
    */

    event.preventDefault();


    applyProgress(
      progress +
      event.deltaY *
      WHEEL_SENSITIVITY
    );

  }


  /* =====================================================
     ANIMATION LOOP
     ===================================================== */

  function animate(){

    const difference =
      targetFrame -
      currentFrame;


    if(
      Math.abs(
        difference
      ) >
      0.01
    ){

      currentFrame +=
        difference *
        CONFIG.ease;

    }

    else{

      currentFrame =
        targetFrame;

    }


    drawFrame(
      Math.round(
        currentFrame
      )
    );


    requestAnimationFrame(
      animate
    );

  }


  /* =====================================================
     INIT
     ===================================================== */

  async function init(){

    window.addEventListener(
      "resize",
      resizeCanvas,
      {
        passive:true
      }
    );


    canvas.addEventListener(
      "wheel",
      handleWheel,
      {
        passive:false
      }
    );


    resizeCanvas();


    await preloadFrames();


    drawFrame(
      0
    );


    applyProgress(
      0
    );


    animate();


    /*
      Preloader
      kapat
    */

    if(
      preloadOverlay
    ){

      preloadOverlay.classList.add(
        "hidden"
      );


      setTimeout(
        ()=>{

          if(
            preloadOverlay
          ){

            preloadOverlay.remove();

          }

        },
        600
      );

    }

  }


  init();

})();

</script>

</body>
</html>
