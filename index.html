<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>TapVia NFC</title>


<style>

/* =====================================================
   ROOT
   ===================================================== */

:root{

  --bg:#ffffff;

  --fg:#222222;

  --accent:#e6005c;

}


/* =====================================================
   RESET
   ===================================================== */

*{

  box-sizing:border-box;

  margin:0;

  padding:0;

}


html,
body{

  width:100%;

  height:100%;

  margin:0;

  padding:0;

  background:#ffffff;

  color:var(--fg);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Inter",
    Arial,
    sans-serif;

  overflow:hidden;

}


/* =====================================================
   ANA ALAN
   ===================================================== */

.scroll-section{

  position:relative;

  width:100%;

  height:100vh;

  min-height:650px;

  background:#ffffff;

  overflow:hidden;

}


.sticky-wrap{

  position:relative;

  width:100%;

  height:100%;

  background:#ffffff;

  overflow:hidden;

}


/* =====================================================
   CANVAS / ÜRÜN GÖRSELİ
   ===================================================== */

#sequence-canvas{

  position:absolute;

  top:50%;

  left:auto;

  right:1.5mm;

  transform:
    translateY(-50%);

  height:104vh;

  width:auto;

  max-width:none;

  aspect-ratio:478 / 850;

  display:block;

  background:#ffffff;

}


/* =====================================================
   VERTICAL PROGRESS AREA
   ===================================================== */

.tapvia-progress{

  position:absolute;

  top:50%;

  right:calc(
    1.5mm + 96vh * 0.5647
  );

  transform:
    translateY(-50%);

  width:46px;

  height:62vh;

  z-index:20;

  display:flex;

  align-items:center;

  justify-content:center;

}


/* =====================================================
   OKUN DIŞ GÖVDESİ
   ===================================================== */

.tapvia-arrow{

  position:relative;

  width:8px;

  height:100%;

  border-radius:8px;

  background:
    rgba(
      230,
      0,
      92,
      .14
    );

}


/* =====================================================
   OKUN İÇ DOLGUSU

   Aşağıdan yukarı doğru dolar.
   ===================================================== */

.tapvia-arrow-fill{

  position:absolute;

  left:0;

  bottom:0;

  width:100%;

  height:0%;

  border-radius:8px;

  background:
    var(--accent);

  transition:
    height .08s linear;

}


/* =====================================================
   OK BAŞI / ÜÇGEN

   Üst tarafa bakıyor.
   ===================================================== */

.tapvia-arrow-head{

  position:absolute;

  top:-2px;

  left:50%;

  width:0;

  height:0;

  transform:
    translateX(-50%);

  border-left:
    14px solid transparent;

  border-right:
    14px solid transparent;

  border-bottom:
    20px solid
    rgba(
      230,
      0,
      92,
      .18
    );

}


/* =====================================================
   DOLU OK BAŞI

   İlerledikçe görünür.
   ===================================================== */

.tapvia-arrow-head-fill{

  position:absolute;

  top:-2px;

  left:50%;

  width:0;

  height:0;

  transform:
    translateX(-50%);

  border-left:
    14px solid transparent;

  border-right:
    14px solid transparent;

  border-bottom:
    20px solid
    var(--accent);

  opacity:0;

  transition:
    opacity .12s linear;

}


/* =====================================================
   KAYDIR YAZISI
   ===================================================== */

.tapvia-scroll-label{

  position:absolute;

  top:calc(100% + 16px);

  left:50%;

  transform:
    translateX(-50%);

  white-space:nowrap;

  color:#333333;

  font-size:12px;

  font-weight:600;

  letter-spacing:.12em;

  text-transform:uppercase;

}


/* =====================================================
   YÜZDE
   ===================================================== */

.tapvia-percent{

  position:absolute;

  bottom:
    calc(
      100% + 15px
    );

  left:50%;

  transform:
    translateX(-50%);

  color:#777777;

  font-size:10px;

  font-weight:600;

  letter-spacing:.08em;

  white-space:nowrap;

}


/* =====================================================
   MOBİL
   ===================================================== */

@media(max-width:700px){

  #sequence-canvas{

    right:1.5mm;

    height:94vh;

  }


  .tapvia-progress{

    /*
      Mobilde ok görselin biraz
      daha solunda.
    */

    right:
      calc(
        1.5mm + 84vh * 0.5647
      );

    height:56vh;

    width:42px;

  }


  .tapvia-arrow{

    width:7px;

  }


  .tapvia-arrow-head,
  .tapvia-arrow-head-fill{

    border-left-width:12px;

    border-right-width:12px;

    border-bottom-width:18px;

  }


  .tapvia-scroll-label{

    font-size:11px;

  }

}


/* =====================================================
   PRELOADER
   ===================================================== */

#preload-overlay{

  position:fixed;

  inset:0;

  width:100%;

  height:100%;

  z-index:9999;

  background:#ffffff;

  display:flex;

  align-items:center;

  justify-content:center;

  opacity:1;

  visibility:visible;

  transition:
    opacity .5s ease,
    visibility .5s ease;

}


#preload-overlay.hidden{

  opacity:0;

  visibility:hidden;

  pointer-events:none;

}


.preload-bar-track{

  width:180px;

  height:2px;

  background:
    rgba(
      0,
      0,
      0,
      .12
    );

  overflow:hidden;

  border-radius:2px;

}


.preload-bar-fill{

  width:0%;

  height:100%;

  background:
    var(--accent);

}

</style>

</head>


<body>


<!-- =====================================================
     PRELOAD
     ===================================================== -->

<div id="preload-overlay">

  <div class="preload-bar-track">

    <div
      class="preload-bar-fill"
      id="preload-bar-fill">
    </div>

  </div>

</div>


<!-- =====================================================
     MAIN
     ===================================================== -->

<section
  id="story"
  class="scroll-section">


  <div class="sticky-wrap">


    <!-- =================================================
         ÜRÜN
         ================================================= -->

    <canvas
      id="sequence-canvas">
    </canvas>


    <!-- =================================================
         VERTICAL PROGRESS
         ================================================= -->

    <div
      class="tapvia-progress"
      id="tapvia-progress">


      <!-- YÜZDE -->

      <div
        class="tapvia-percent"
        id="tapvia-percent">

        0%

      </div>


      <!-- OK -->

      <div
        class="tapvia-arrow">


        <!-- DIŞ GÖVDE DOLGUSU -->

        <div
          class="tapvia-arrow-fill"
          id="tapvia-arrow-fill">
        </div>


        <!-- SABİT OK BAŞI -->

        <div
          class="tapvia-arrow-head">
        </div>


        <!-- DOLAN OK BAŞI -->

        <div
          class="tapvia-arrow-head-fill"
          id="tapvia-arrow-head-fill">
        </div>


      </div>


      <!-- KAYDIR -->

      <div
        class="tapvia-scroll-label">

        KAYDIR

      </div>


    </div>


  </div>

</section>


<script>

(() => {

  "use strict";


  /* =====================================================
     CONFIG
     ===================================================== */

  const CONFIG = {

    /*
      Frame'ler index.html ile
      AYNI klasörde.
    */

    frameFolder:
      ".",


    /*
      Dosya formatı:

      ezgif-frame-001.jpg
      ezgif-frame-002.jpg
      ...
      ezgif-frame-110.jpg
    */

    framePrefix:
      "ezgif-frame-",

    frameExt:
      "jpg",

    frameCount:
      110,

    padLength:
      3,


    /*
      Beyaz arka plan
    */

    background:
      "#ffffff",


    /*
      Frame yumuşaklığı
    */

    ease:
      0.08

  };


  /* =====================================================
     DOM
     ===================================================== */

  const canvas =
    document.getElementById(
      "sequence-canvas"
    );


  const ctx =
    canvas.getContext(
      "2d"
    );


  const progressFill =
    document.getElementById(
      "tapvia-arrow-fill"
    );


  const progressArea =
    document.getElementById(
      "tapvia-progress"
    );


  const percentLabel =
    document.getElementById(
      "tapvia-percent"
    );


  const arrowHeadFill =
    document.getElementById(
      "tapvia-arrow-head-fill"
    );


  const preload =
    document.getElementById(
      "preload-overlay"
    );


  const preloadFill =
    document.getElementById(
      "preload-bar-fill"
    );


  if(
    !canvas ||
    !ctx
  ){

    return;

  }


  /* =====================================================
     FRAME URL
     ===================================================== */

  function frameUrl(
    index
  ){

    const number =
      String(
        index + 1
      ).padStart(
        CONFIG.padLength,
        "0"
      );


    return (

      CONFIG.frameFolder +

      "/" +

      CONFIG.framePrefix +

      number +

      "." +

      CONFIG.frameExt

    );

  }


  /* =====================================================
     IMAGES
     ===================================================== */

  const images =
    new Array(
      CONFIG.frameCount
    );


  let loadedCount =
    0;


  /* =====================================================
     PRELOAD
     ===================================================== */

  function preloadFrames(){

    return new Promise(
      (resolve)=>{

        for(
          let i = 0;
          i < CONFIG.frameCount;
          i++
        ){

          const img =
            new Image();


          img.src =
            frameUrl(i);


          img.onload =
            ()=>{

              loadedCount++;


              const percent =
                Math.round(
                  (
                    loadedCount /
                    CONFIG.frameCount
                  ) * 100
                );


              if(
                preloadFill
              ){

                preloadFill.style.width =
                  percent + "%";

              }


              if(
                loadedCount ===
                CONFIG.frameCount
              ){

                resolve();

              }

            };


          img.onerror =
            ()=>{

              console.warn(
                "Frame yüklenemedi:",
                img.src
              );


              loadedCount++;


              const percent =
                Math.round(
                  (
                    loadedCount /
                    CONFIG.frameCount
                  ) * 100
                );


              if(
                preloadFill
              ){

                preloadFill.style.width =
                  percent + "%";

              }


              if(
                loadedCount ===
                CONFIG.frameCount
              ){

                resolve();

              }

            };


          images[i] =
            img;

        }

      }
    );

  }


  /* =====================================================
     CANVAS
     ===================================================== */

  let dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );


  let currentFrame =
    0;


  let targetFrame =
    0;


  let frameProgress =
    0;


  /* =====================================================
     RESIZE
     ===================================================== */

  function resizeCanvas(){

    dpr =
      Math.min(
        window.devicePixelRatio || 1,
        2
      );


    const rect =
      canvas.getBoundingClientRect();


    canvas.width =
      Math.round(
        rect.width *
        dpr
      );


    canvas.height =
      Math.round(
        rect.height *
        dpr
      );


    ctx.setTransform(
      dpr,
      0,
      0,
      dpr,
      0,
      0
    );


    drawFrame(
      Math.round(
        currentFrame
      )
    );

  }


  /* =====================================================
     DRAW FRAME
     ===================================================== */

  function drawFrame(
    frameIndex
  ){

    const index =
      Math.min(
        Math.max(
          frameIndex,
          0
        ),
        images.length - 1
      );


    const img =
      images[index];


    if(
      !img ||
      !img.complete ||
      img.naturalWidth === 0
    ){

      return;

    }


    const rect =
      canvas.getBoundingClientRect();


    const width =
      rect.width;


    const height =
      rect.height;


    /*
      Beyaz zemin
    */

    ctx.fillStyle =
      CONFIG.background;


    ctx.fillRect(
      0,
      0,
      width,
      height
    );


    /*
      Kalite
    */

    ctx.imageSmoothingEnabled =
      true;


    ctx.imageSmoothingQuality =
      "high";


    /*
      Görsel oranı
    */

    const imageRatio =
      img.naturalWidth /
      img.naturalHeight;


    const canvasRatio =
      width /
      height;


    let drawWidth;
    let drawHeight;
    let x;
    let y;


    /*
      COVER
    */

    if(
      canvasRatio >
      imageRatio
    ){

      drawWidth =
        width;


      drawHeight =
        width /
        imageRatio;


      x =
        0;


      y =
        (
          height -
          drawHeight
        ) / 2;

    }

    else{

      drawHeight =
        height;


      drawWidth =
        height *
        imageRatio;


      x =
        (
          width -
          drawWidth
        ) / 2;


      y =
        0;

    }


    /*
      FRAME
    */

    ctx.drawImage(
      img,
      x,
      y,
      drawWidth,
      drawHeight
    );

  }


  /* =====================================================
     PROGRESS
     ===================================================== */

  const WHEEL_SENSITIVITY =
    0.0016;


  function applyProgress(
    value
  ){

    /*
      0 → 1
    */

    frameProgress =
      Math.min(
        Math.max(
          value,
          0
        ),
        1
      );


    /*
      Frame
    */

    targetFrame =
      frameProgress *
      (
        CONFIG.frameCount - 1
      );


    /*
      OK DOLGUSU

      0% → aşağıda
      100% → yukarıda
    */

    if(
      progressFill
    ){

      progressFill.style.height =
        (
          frameProgress *
          100
        ) + "%";

    }


    /*
      Yüzde
    */

    if(
      percentLabel
    ){

      percentLabel.textContent =
        Math.round(
          frameProgress *
          100
        ) + "%";

    }


    /*
      Ok başı

      Başlangıçta gizli,
      sona geldikçe görünür.
    */

    if(
      arrowHeadFill
    ){

      arrowHeadFill.style.opacity =
        frameProgress >
        0.02
          ? "1"
          : "0";

    }

  }


  /* =====================================================
     WHEEL
     ===================================================== */

  function handleWheel(
    event
  ){

    /*
      Canvas üzerinde
      wheel = frame ilerlemesi
    */

    event.preventDefault();


    applyProgress(
      frameProgress +
      (
        event.deltaY *
        WHEEL_SENSITIVITY
      )
    );

  }


  /* =====================================================
     ANIMATION LOOP
     ===================================================== */

  function animate(){

    const difference =
      targetFrame -
      currentFrame;


    if(
      Math.abs(
        difference
      ) >
      0.01
    ){

      currentFrame +=
        difference *
        CONFIG.ease;

    }

    else{

      currentFrame =
        targetFrame;

    }


    drawFrame(
      Math.round(
        currentFrame
      )
    );


    requestAnimationFrame(
      animate
    );

  }


  /* =====================================================
     INIT
     ===================================================== */

  async function init(){

    /*
      Resize
    */

    window.addEventListener(
      "resize",
      resizeCanvas,
      {
        passive:true
      }
    );


    /*
      Wheel
    */

    canvas.addEventListener(
      "wheel",
      handleWheel,
      {
        passive:false
      }
    );


    /*
      Canvas
    */

    resizeCanvas();


    /*
      Frame preload
    */

    await preloadFrames();


    /*
      İlk frame
    */

    drawFrame(
      0
    );


    /*
      Başlangıç
    */

    applyProgress(
      0
    );


    /*
      Animasyon
    */

    animate();


    /*
      Preloader kapat
    */

    if(
      preload
    ){

      preload.classList.add(
        "hidden"
      );


      setTimeout(
        ()=>{

          if(
            preload
          ){

            preload.remove();

          }

        },
        600
      );

    }

  }


  init();

})();

</script>

</body>
</html>
