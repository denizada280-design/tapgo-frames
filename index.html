<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TapVia NFC</title>

<style>

:root{
  --bg:#ffffff;
  --accent:#e6005c;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;

  margin:0;
  padding:0;

  background:#ffffff;

  overflow:hidden;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Inter",
    Arial,
    sans-serif;
}


/* =====================================================
   MAIN
   ===================================================== */

.tapvia-frame-view{

  position:relative;

  width:100%;
  height:100vh;

  min-height:650px;

  background:#ffffff;

  overflow:hidden;
}


/* =====================================================
   CANVAS
   ===================================================== */

#tapviaCanvas{

  position:absolute;

  top:50%;
  left:50%;

  transform:
    translate(-50%,-50%);

  height:92vh;

  width:auto;

  max-width:96vw;

  aspect-ratio:478 / 850;

  display:block;

  background:#ffffff;
}


/* =====================================================
   PROGRESS
   ===================================================== */

.tapvia-progress{

  position:absolute;

  left:50%;
  bottom:43px;

  transform:
    translateX(-50%);

  width:min(45%,300px);

  height:2px;

  background:
    rgba(30,30,30,.14);

  overflow:hidden;

  z-index:10;
}

.tapvia-progress-fill{

  width:0%;

  height:100%;

  background:#e6005c;
}


/* =====================================================
   KAYDIR
   ===================================================== */

.tapvia-scroll{

  position:absolute;

  left:50%;
  bottom:58px;

  transform:
    translateX(-50%);

  color:#555;

  font-size:10px;

  letter-spacing:.18em;

  text-transform:uppercase;

  z-index:10;

  animation:
    tapviaBob 1.8s ease-in-out infinite;
}


@keyframes tapviaBob{

  0%,100%{
    transform:
      translate(-50%,0);
  }

  50%{
    transform:
      translate(-50%,6px);
  }

}


/* =====================================================
   PRELOADER
   ===================================================== */

#tapviaPreload{

  position:fixed;

  inset:0;

  z-index:9999;

  background:#ffffff;

  display:flex;

  align-items:center;

  justify-content:center;

  transition:
    opacity .45s ease;
}

#tapviaPreload.hide{

  opacity:0;

  pointer-events:none;
}

.tapvia-preload-track{

  width:180px;

  height:2px;

  background:
    rgba(0,0,0,.12);
}

#tapviaPreloadFill{

  width:0%;

  height:100%;

  background:#e6005c;
}

</style>
</head>


<body>


<!-- =====================================================
     PRELOADER
     ===================================================== -->

<div id="tapviaPreload">

  <div class="tapvia-preload-track">

    <div id="tapviaPreloadFill"></div>

  </div>

</div>


<!-- =====================================================
     FRAME VIEW
     ===================================================== -->

<div class="tapvia-frame-view">


  <canvas
    id="tapviaCanvas">
  </canvas>


  <div
    class="tapvia-scroll">
    KAYDIR
  </div>


  <div class="tapvia-progress">

    <div
      class="tapvia-progress-fill"
      id="tapviaProgressFill">
    </div>

  </div>


</div>


<script>

(function(){

"use strict";


/* =====================================================
   CONFIG
   ===================================================== */

const CONFIG = {

  framePrefix:
    "ezgif-frame-",

  frameExt:
    "jpg",

  frameCount:
    110,

  padLength:
    3,

  ease:
    0.08

};


/* =====================================================
   ELEMENTS
   ===================================================== */

const canvas =
  document.getElementById(
    "tapviaCanvas"
  );

const ctx =
  canvas.getContext(
    "2d"
  );

const preload =
  document.getElementById(
    "tapviaPreload"
  );

const preloadFill =
  document.getElementById(
    "tapviaPreloadFill"
  );

const progressFill =
  document.getElementById(
    "tapviaProgressFill"
  );


/* =====================================================
   FRAME URL
   ===================================================== */

function frameUrl(index){

  const number =
    String(index + 1)
      .padStart(
        CONFIG.padLength,
        "0"
      );

  return (
    "./" +
    CONFIG.framePrefix +
    number +
    "." +
    CONFIG.frameExt
  );

}


/* =====================================================
   IMAGES
   ===================================================== */

const images =
  new Array(
    CONFIG.frameCount
  );

let loaded =
  0;


/* =====================================================
   PRELOAD
   ===================================================== */

function preloadFrames(){

  return new Promise(
    resolve => {

      for(
        let i=0;
        i<CONFIG.frameCount;
        i++
      ){

        const img =
          new Image();

        img.src =
          frameUrl(i);

        img.onload =
          function(){

            loaded++;

            const percent =
              Math.round(
                (
                  loaded /
                  CONFIG.frameCount
                ) * 100
              );

            preloadFill.style.width =
              percent + "%";

            if(
              loaded ===
              CONFIG.frameCount
            ){

              resolve();

            }

          };

        img.onerror =
          function(){

            console.warn(
              "Frame bulunamadı:",
              img.src
            );

            loaded++;

            const percent =
              Math.round(
                (
                  loaded /
                  CONFIG.frameCount
                ) * 100
              );

            preloadFill.style.width =
              percent + "%";

            if(
              loaded ===
              CONFIG.frameCount
            ){

              resolve();

            }

          };

        images[i] =
          img;

      }

    }
  );

}


/* =====================================================
   CANVAS SIZE
   ===================================================== */

let dpr =
  Math.min(
    window.devicePixelRatio || 1,
    2
  );

let currentFrame =
  0;

let targetFrame =
  0;

let progress =
  0;


function resizeCanvas(){

  dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  const rect =
    canvas.getBoundingClientRect();

  canvas.width =
    Math.round(
      rect.width * dpr
    );

  canvas.height =
    Math.round(
      rect.height * dpr
    );

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

  drawFrame(
    Math.round(
      currentFrame
    )
  );

}


/* =====================================================
   DRAW
   ===================================================== */

function drawFrame(
  frameIndex
){

  const index =
    Math.min(
      Math.max(
        frameIndex,
        0
      ),
      images.length - 1
    );

  const img =
    images[index];

  if(
    !img ||
    !img.complete ||
    img.naturalWidth === 0
  ){

    return;

  }


  const rect =
    canvas.getBoundingClientRect();

  const width =
    rect.width;

  const height =
    rect.height;


  /*
    BEYAZ ZEMİN
  */

  ctx.fillStyle =
    "#ffffff";

  ctx.fillRect(
    0,
    0,
    width,
    height
  );


  ctx.imageSmoothingEnabled =
    true;

  ctx.imageSmoothingQuality =
    "high";


  /*
    COVER
  */

  const imageRatio =
    img.naturalWidth /
    img.naturalHeight;

  const canvasRatio =
    width / height;

  let drawWidth;
  let drawHeight;
  let x;
  let y;


  if(
    canvasRatio >
    imageRatio
  ){

    drawWidth =
      width;

    drawHeight =
      width /
      imageRatio;

    x =
      0;

    y =
      (
        height -
        drawHeight
      ) / 2;

  }

  else{

    drawHeight =
      height;

    drawWidth =
      height *
      imageRatio;

    x =
      (
        width -
        drawWidth
      ) / 2;

    y =
      0;

  }


  ctx.drawImage(
    img,
    x,
    y,
    drawWidth,
    drawHeight
  );

}


/* =====================================================
   PROGRESS
   ===================================================== */

const WHEEL_SENSITIVITY =
  0.0016;


function applyProgress(
  value
){

  progress =
    Math.min(
      Math.max(
        value,
        0
      ),
      1
    );

  targetFrame =
    progress *
    (
      CONFIG.frameCount - 1
    );

  progressFill.style.width =
    (
      progress * 100
    ) + "%";

}


/* =====================================================
   WHEEL
   ===================================================== */

function handleWheel(
  event
){

  event.preventDefault();

  applyProgress(
    progress +
    event.deltaY *
    WHEEL_SENSITIVITY
  );

}


/* =====================================================
   ANIMATION
   ===================================================== */

function animate(){

  const difference =
    targetFrame -
    currentFrame;

  if(
    Math.abs(difference) >
    0.01
  ){

    currentFrame +=
      difference *
      CONFIG.ease;

  }
  else{

    currentFrame =
      targetFrame;

  }

  drawFrame(
    Math.round(
      currentFrame
    )
  );

  requestAnimationFrame(
    animate
  );

}


/* =====================================================
   INIT
   ===================================================== */

async function init(){

  window.addEventListener(
    "resize",
    resizeCanvas,
    {
      passive:true
    }
  );

  canvas.addEventListener(
    "wheel",
    handleWheel,
    {
      passive:false
    }
  );

  resizeCanvas();

  await preloadFrames();

  drawFrame(
    0
  );

  applyProgress(
    0
  );

  animate();


  preload.classList.add(
    "hide"
  );


  setTimeout(
    function(){

      if(preload){

        preload.remove();

      }

    },
    500
  );

}


init();

})();

</script>

</body>
</html>
