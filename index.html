<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>TapVia NFC</title>

<style>

:root{
  --bg:#ffffff;
  --fg:#222222;
  --accent:#e6005c;
}


/* =========================
   RESET
   ========================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}


html,
body{

  width:100%;
  height:100%;

  margin:0;
  padding:0;

  background:#ffffff;

  color:var(--fg);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Inter",
    Arial,
    sans-serif;

  overflow-x:hidden;
}


/* =========================
   STORY
   ========================= */

.scroll-section{

  position:relative;

  width:100%;

  height:100vh;

  min-height:650px;

  background:#ffffff;

  overflow:hidden;
}


.sticky-wrap{

  position:relative;

  width:100%;
  height:100%;

  background:#ffffff;

  overflow:hidden;
}


/* =========================
   CANVAS
   ========================= */

#sequence-canvas{

  position:absolute;

  top:50%;
  left:50%;

  transform:
    translate(-50%,-50%);

  height:92vh;

  width:auto;

  max-width:94vw;

  aspect-ratio:478 / 850;

  display:block;

  background:#ffffff;

}


/* =========================
   PROGRESS
   ========================= */

.scroll-progress-track{

  position:absolute;

  bottom:32px;

  left:50%;

  transform:
    translateX(-50%);

  width:
    min(
      60%,
      320px
    );

  height:2px;

  background:
    rgba(
      0,
      0,
      0,
      .14
    );

  border-radius:2px;

  overflow:hidden;

  z-index:10;
}


.scroll-progress-fill{

  width:0%;

  height:100%;

  background:#e6005c;

}


/* =========================
   KAYDIR
   ========================= */

.scroll-hint{

  position:absolute;

  bottom:48px;

  left:50%;

  transform:
    translateX(-50%);

  font-size:11px;

  letter-spacing:.15em;

  text-transform:uppercase;

  color:#555;

  opacity:.7;

  z-index:10;

  animation:
    bob 1.8s ease-in-out infinite;
}


@keyframes bob{

  0%,
  100%{

    transform:
      translate(-50%,0);

  }

  50%{

    transform:
      translate(-50%,6px);

  }

}


/* =========================
   PRELOADER
   ========================= */

#preload-overlay{

  position:fixed;

  inset:0;

  z-index:9999;

  width:100%;
  height:100%;

  background:#ffffff;

  display:flex;

  align-items:center;

  justify-content:center;

  opacity:1;

  visibility:visible;

  transition:
    opacity .5s ease,
    visibility .5s ease;
}


#preload-overlay.hidden{

  opacity:0;

  visibility:hidden;

  pointer-events:none;
}


.preload-bar-track{

  width:200px;

  height:2px;

  background:
    rgba(
      0,
      0,
      0,
      .12
    );

  border-radius:2px;

  overflow:hidden;
}


.preload-bar-fill{

  width:0%;

  height:100%;

  background:#e6005c;

}


/* =========================
   MOBILE
   ========================= */

@media(max-width:700px){

  .scroll-section{

    min-height:600px;

  }


  #sequence-canvas{

    height:88vh;

    max-width:96vw;

  }


  .scroll-progress-track{

    width:65%;

    bottom:30px;

  }


  .scroll-hint{

    bottom:46px;

  }

}

</style>
</head>


<body>


<!-- =====================================================
     PRELOADER
     ===================================================== -->

<div id="preload-overlay">

  <div class="preload-bar-track">

    <div
      class="preload-bar-fill"
      id="preload-bar-fill">
    </div>

  </div>

</div>


<!-- =====================================================
     MAIN STORY
     ===================================================== -->

<section
  id="story"
  class="scroll-section">

  <div class="sticky-wrap">


    <!-- FRAME CANVAS -->

    <canvas
      id="sequence-canvas">
    </canvas>


    <!-- PROGRESS -->

    <div
      class="scroll-progress-track">

      <div
        class="scroll-progress-fill"
        id="progress-fill">
      </div>

    </div>


    <!-- KAYDIR -->

    <div class="scroll-hint">
      KAYDIR
    </div>


  </div>

</section>


<script>

(() => {

  "use strict";


  /* =====================================================
     CONFIG
     ===================================================== */

  const CONFIG = {

    /*
      GitHub'daki index.html ile frame'ler
      AYNI klasörde.

      Dosyalar:

      ezgif-frame-001.jpg
      ezgif-frame-002.jpg
      ezgif-frame-003.jpg
      ...
      ezgif-frame-110.jpg
    */

    frameFolder: ".",


    framePrefix:
      "ezgif-frame-",


    frameExt:
      "jpg",


    frameCount:
      110,


    padLength:
      3,


    /*
      Beyaz arka plan
    */

    background:
      "#ffffff",


    /*
      Animasyon yumuşaklığı

      Daha küçük:
      daha yumuşak

      Daha büyük:
      daha hızlı
    */

    ease:
      0.08

  };


  /* =====================================================
     DOM
     ===================================================== */

  const canvas =
    document.getElementById(
      "sequence-canvas"
    );


  const ctx =
    canvas.getContext(
      "2d"
    );


  const progressFill =
    document.getElementById(
      "progress-fill"
    );


  const preloadOverlay =
    document.getElementById(
      "preload-overlay"
    );


  const preloadBarFill =
    document.getElementById(
      "preload-bar-fill"
    );


  if(
    !canvas ||
    !ctx
  ){

    return;

  }


  /*
    Canvas arka planı
  */

  canvas.style.background =
    CONFIG.background;


  /*
    CSS değişkeni
  */

  document.documentElement.style
    .setProperty(
      "--bg",
      CONFIG.background
    );


  /* =====================================================
     FRAME URL
     ===================================================== */

  function frameUrl(
    index
  ){

    /*
      index 0:
      ezgif-frame-001.jpg

      index 1:
      ezgif-frame-002.jpg

      ...

      index 109:
      ezgif-frame-110.jpg
    */

    const number =
      String(
        index + 1
      ).padStart(
        CONFIG.padLength,
        "0"
      );


    return (
      CONFIG.frameFolder +
      "/" +
      CONFIG.framePrefix +
      number +
      "." +
      CONFIG.frameExt
    );

  }


  /* =====================================================
     IMAGE ARRAY
     ===================================================== */

  const images =
    new Array(
      CONFIG.frameCount
    );


  let loadedCount =
    0;


  /* =====================================================
     PRELOAD FRAMES
     ===================================================== */

  function preloadFrames(){

    return new Promise(
      (resolve)=>{

        /*
          Hiç frame yoksa
        */

        if(
          CONFIG.frameCount <= 0
        ){

          resolve();

          return;

        }


        /*
          Tüm frame'leri yükle
        */

        for(
          let i = 0;
          i < CONFIG.frameCount;
          i++
        ){

          const img =
            new Image();


          img.src =
            frameUrl(i);


          /*
            Başarılı yükleme
          */

          img.onload =
            () => {

              loadedCount++;


              const percent =
                Math.round(
                  (
                    loadedCount /
                    CONFIG.frameCount
                  ) * 100
                );


              if(
                preloadBarFill
              ){

                preloadBarFill.style.width =
                  percent + "%";

              }


              if(
                loadedCount ===
                CONFIG.frameCount
              ){

                resolve();

              }

            };


          /*
            Eksik frame varsa
            preload sonsuza kadar
            beklemesin.
          */

          img.onerror =
            () => {

              console.warn(
                "Frame yüklenemedi:",
                img.src
              );


              loadedCount++;


              const percent =
                Math.round(
                  (
                    loadedCount /
                    CONFIG.frameCount
                  ) * 100
                );


              if(
                preloadBarFill
              ){

                preloadBarFill.style.width =
                  percent + "%";

              }


              if(
                loadedCount ===
                CONFIG.frameCount
              ){

                resolve();

              }

            };


          images[i] =
            img;

        }

      }
    );

  }


  /* =====================================================
     CANVAS STATE
     ===================================================== */

  let dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );


  let currentFrame =
    0;


  let targetFrame =
    0;


  let frameProgress =
    0;


  /* =====================================================
     RESIZE
     ===================================================== */

  function resizeCanvas(){

    dpr =
      Math.min(
        window.devicePixelRatio || 1,
        2
      );


    const rect =
      canvas.getBoundingClientRect();


    canvas.width =
      Math.round(
        rect.width *
        dpr
      );


    canvas.height =
      Math.round(
        rect.height *
        dpr
      );


    ctx.setTransform(
      dpr,
      0,
      0,
      dpr,
      0,
      0
    );


    drawFrame(
      Math.round(
        currentFrame
      )
    );

  }


  /* =====================================================
     DRAW FRAME
     ===================================================== */

  function drawFrame(
    frameIndex
  ){

    /*
      Frame sınırları
    */

    const maxIndex =
      images.length - 1;


    const index =
      Math.min(
        Math.max(
          frameIndex,
          0
        ),
        maxIndex
      );


    const img =
      images[index];


    /*
      Görsel hazır değilse
    */

    if(
      !img ||
      !img.complete ||
      img.naturalWidth === 0
    ){

      return;

    }


    const rect =
      canvas.getBoundingClientRect();


    const canvasWidth =
      rect.width;


    const canvasHeight =
      rect.height;


    /*
      ===============================
      BEYAZ ZEMİN
      ===============================
    */

    ctx.fillStyle =
      CONFIG.background;


    ctx.fillRect(
      0,
      0,
      canvasWidth,
      canvasHeight
    );


    /*
      Görüntü kalitesi
    */

    ctx.imageSmoothingEnabled =
      true;


    ctx.imageSmoothingQuality =
      "high";


    /*
      ===============================
      COVER FIT
      ===============================
    */

    const imageRatio =
      img.naturalWidth /
      img.naturalHeight;


    const canvasRatio =
      canvasWidth /
      canvasHeight;


    let drawWidth;
    let drawHeight;
    let drawX;
    let drawY;


    if(
      canvasRatio >
      imageRatio
    ){

      /*
        Canvas daha geniş
      */

      drawWidth =
        canvasWidth;


      drawHeight =
        canvasWidth /
        imageRatio;


      drawX =
        0;


      drawY =
        (
          canvasHeight -
          drawHeight
        ) / 2;

    }

    else{

      /*
        Canvas daha uzun
      */

      drawHeight =
        canvasHeight;


      drawWidth =
        canvasHeight *
        imageRatio;


      drawX =
        (
          canvasWidth -
          drawWidth
        ) / 2;


      drawY =
        0;

    }


    /*
      FRAME ÇİZ
    */

    ctx.drawImage(
      img,
      drawX,
      drawY,
      drawWidth,
      drawHeight
    );

  }


  /* =====================================================
     PROGRESS
     ===================================================== */

  const WHEEL_SENSITIVITY =
    0.0016;


  function applyProgress(
    value
  ){

    /*
      0–1 arasında tut
    */

    frameProgress =
      Math.min(
        Math.max(
          value,
          0
        ),
        1
      );


    /*
      0 → 109 frame
    */

    targetFrame =
      frameProgress *
      (
        CONFIG.frameCount - 1
      );


    /*
      Progress çizgisi
    */

    if(
      progressFill
    ){

      progressFill.style.width =
        (
          frameProgress *
          100
        ) + "%";

    }

  }


  /* =====================================================
     WHEEL
     ===================================================== */

  function onCanvasWheel(
    event
  ){

    /*
      Animasyon alanında
      sayfa scroll olmaz.

      Frame değişir.
    */

    event.preventDefault();


    applyProgress(
      frameProgress +
      event.deltaY *
      WHEEL_SENSITIVITY
    );

  }


  /* =====================================================
     ANIMATION LOOP
     ===================================================== */

  function animate(){

    const difference =
      targetFrame -
      currentFrame;


    if(
      Math.abs(difference) >
      0.01
    ){

      currentFrame +=
        difference *
        CONFIG.ease;

    }

    else{

      currentFrame =
        targetFrame;

    }


    drawFrame(
      Math.round(
        currentFrame
      )
    );


    requestAnimationFrame(
      animate
    );

  }


  /* =====================================================
     INIT
     ===================================================== */

  async function init(){

    /*
      Resize
    */

    window.addEventListener(
      "resize",
      resizeCanvas,
      {
        passive:true
      }
    );


    /*
      Wheel
    */

    canvas.addEventListener(
      "wheel",
      onCanvasWheel,
      {
        passive:false
      }
    );


    /*
      Canvas ölçüsü
    */

    resizeCanvas();


    /*
      Frame'leri yükle
    */

    await preloadFrames();


    /*
      İlk frame
    */

    drawFrame(
      0
    );


    /*
      Başlangıç
    */

    applyProgress(
      0
    );


    /*
      Animasyon başlat
    */

    animate();


    /*
      PRELOADER KAPAT
    */

    if(
      preloadOverlay
    ){

      preloadOverlay.classList.add(
        "hidden"
      );


      setTimeout(
        () => {

          if(
            preloadOverlay
          ){

            preloadOverlay.remove();

          }

        },
        600
      );

    }

  }


  /*
    BAŞLAT
  */

  init();

})();

</script>

</body>
</html>
