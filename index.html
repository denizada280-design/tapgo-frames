<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>TapVia NFC</title>

<style>

/* =====================================================
   ROOT
   ===================================================== */

:root{
  --bg:#ffffff;
  --fg:#222222;
  --accent:#e6005c;
}


/* =====================================================
   RESET
   ===================================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{

  width:100%;
  height:100%;

  margin:0;
  padding:0;

  background:#ffffff;

  color:var(--fg);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Inter",
    Arial,
    sans-serif;

  overflow:hidden;
}


/* =====================================================
   ANA ALAN
   ===================================================== */

.scroll-section{

  position:relative;

  width:100%;
  height:100vh;

  min-height:650px;

  background:#ffffff;

  overflow:hidden;
}


.sticky-wrap{

  position:relative;

  width:100%;
  height:100%;

  background:#ffffff;

  overflow:hidden;
}


/* =====================================================
   ÜRÜN CANVAS
   ===================================================== */

#sequence-canvas{

  position:absolute;

  top:50%;

  left:auto;

  /*
    SAĞDAN 1.5 MM
  */

  right:1.5mm;

  /*
    KARTI BÜYÜTÜYORUZ
    ve sağ alt/üst boşlukları azaltıyoruz
  */

  transform:
    translateY(-50%);

  height:122vh;

  width:auto;

  max-width:none;

  aspect-ratio:478 / 850;

  display:block;

  background:#ffffff;

}


/* =====================================================
   DİKEY OK KONTROLÜ

   KARTIN DIŞINDA,
   KARTIN SOLUNDA
   ===================================================== */

.tapvia-scroll-control{

  position:absolute;

  top:50%;

  /*
    122vh yüksekliğindeki canvas'ın
    yaklaşık genişliği:

    122 * 478 / 850 = 68.61vh

    Oku kartın soluna taşıyoruz.
  */

  right:
    calc(
      1.5mm +
      68.61vh +
      58px
    );

  transform:
    translateY(-50%);

  width:52px;

  height:58vh;

  min-height:320px;

  z-index:50;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  pointer-events:none;
}


/* =====================================================
   OK GÖVDESİ
   ===================================================== */

.tapvia-arrow{

  position:relative;

  width:8px;

  height:100%;

  border-radius:10px;

  background:
    rgba(
      230,
      0,
      92,
      .14
    );
}


/* =====================================================
   DOLAN KISIM
   AŞAĞIDAN YUKARI
   ===================================================== */

.tapvia-arrow-fill{

  position:absolute;

  left:0;

  bottom:0;

  width:100%;

  height:0%;

  background:
    var(--accent);

  border-radius:10px;
}


/* =====================================================
   SABİT OK BAŞI
   ===================================================== */

.tapvia-arrow-head{

  position:absolute;

  top:-1px;

  left:50%;

  transform:
    translateX(-50%);

  width:0;

  height:0;

  border-left:
    15px solid transparent;

  border-right:
    15px solid transparent;

  border-bottom:
    23px solid
    rgba(
      230,
      0,
      92,
      .18
    );
}


/* =====================================================
   DOLU OK BAŞI
   ===================================================== */

.tapvia-arrow-head-fill{

  position:absolute;

  top:-1px;

  left:50%;

  transform:
    translateX(-50%);

  width:0;

  height:0;

  border-left:
    15px solid transparent;

  border-right:
    15px solid transparent;

  border-bottom:
    23px solid
    var(--accent);

  opacity:0;
}


/* =====================================================
   YÜZDE
   ===================================================== */

.tapvia-percent{

  position:absolute;

  left:50%;

  bottom:
    calc(
      100% + 10px
    );

  transform:
    translateX(-50%);

  color:#777;

  font-size:10px;

  font-weight:600;

  letter-spacing:.08em;

  white-space:nowrap;
}


/* =====================================================
   KAYDIR
   ===================================================== */

.tapvia-scroll-label{

  position:absolute;

  left:50%;

  top:
    calc(
      100% + 15px
    );

  transform:
    translateX(-50%);

  color:#222;

  font-size:12px;

  font-weight:700;

  letter-spacing:.14em;

  white-space:nowrap;

  text-transform:uppercase;
}


/* =====================================================
   PRELOADER
   ===================================================== */

#preload-overlay{

  position:fixed;

  inset:0;

  width:100%;
  height:100%;

  z-index:9999;

  background:#ffffff;

  display:flex;

  align-items:center;

  justify-content:center;

  opacity:1;

  visibility:visible;

  transition:
    opacity .5s ease,
    visibility .5s ease;
}


#preload-overlay.hidden{

  opacity:0;

  visibility:hidden;

  pointer-events:none;
}


.preload-bar-track{

  width:180px;

  height:2px;

  background:
    rgba(
      0,
      0,
      0,
      .12
    );

  border-radius:2px;

  overflow:hidden;
}


.preload-bar-fill{

  width:0%;

  height:100%;

  background:
    var(--accent);
}


/* =====================================================
   MOBİL
   ===================================================== */

@media(max-width:700px){

  .scroll-section{
    min-height:600px;
  }


  #sequence-canvas{

    right:1.5mm;

    height:108vh;

  }


  .tapvia-scroll-control{

    /*
      Mobilde büyüyen kartın
      soluna alıyoruz.
    */

    right:
      calc(
        1.5mm +
        60.94vh +
        30px
      );

    height:54vh;

    min-height:280px;

    width:42px;
  }


  .tapvia-arrow{
    width:7px;
  }


  .tapvia-arrow-head,
  .tapvia-arrow-head-fill{

    border-left-width:12px;

    border-right-width:12px;

    border-bottom-width:19px;
  }


  .tapvia-scroll-label{

    font-size:10px;
  }

}

</style>

</head>


<body>


<!-- =====================================================
     PRELOADER
     ===================================================== -->

<div id="preload-overlay">

  <div class="preload-bar-track">

    <div
      class="preload-bar-fill"
      id="preload-bar-fill">
    </div>

  </div>

</div>


<!-- =====================================================
     MAIN
     ===================================================== -->

<section
  id="story"
  class="scroll-section">

  <div class="sticky-wrap">


    <!-- =================================================
         ÜRÜN
         ================================================= -->

    <canvas
      id="sequence-canvas">
    </canvas>


    <!-- =================================================
         OK + KAYDIR
         ================================================= -->

    <div
      class="tapvia-scroll-control">


      <!-- YÜZDE -->

      <div
        class="tapvia-percent"
        id="tapvia-percent">

        0%

      </div>


      <!-- OK -->

      <div class="tapvia-arrow">


        <!-- DOLAN KISIM -->

        <div
          class="tapvia-arrow-fill"
          id="tapvia-arrow-fill">
        </div>


        <!-- OK BAŞI -->

        <div
          class="tapvia-arrow-head">
        </div>


        <!-- DOLU OK BAŞI -->

        <div
          class="tapvia-arrow-head-fill"
          id="tapvia-arrow-head-fill">
        </div>


      </div>


      <!-- KAYDIR -->

      <div
        class="tapvia-scroll-label">

        KAYDIR

      </div>


    </div>


  </div>

</section>


<script>

(() => {

  "use strict";


  /* =====================================================
     CONFIG
     ===================================================== */

  const CONFIG = {

    /*
      Resimler index.html ile aynı klasörde.
    */

    frameFolder:
      ".",


    /*
      Dosya biçimi:

      ezgif-frame-001.jpg
      ezgif-frame-002.jpg
      ...
      ezgif-frame-110.jpg
    */

    framePrefix:
      "ezgif-frame-",

    frameExt:
      "jpg",

    frameCount:
      110,

    padLength:
      3,


    /*
      BEYAZ ARKA PLAN
    */

    background:
      "#ffffff",


    /*
      Frame yumuşaklığı
    */

    ease:
      0.08

  };


  /* =====================================================
     DOM
     ===================================================== */

  const canvas =
    document.getElementById(
      "sequence-canvas"
    );


  const ctx =
    canvas.getContext(
      "2d"
    );


  const progressFill =
    document.getElementById(
      "tapvia-arrow-fill"
    );


  const arrowHeadFill =
    document.getElementById(
      "tapvia-arrow-head-fill"
    );


  const percentLabel =
    document.getElementById(
      "tapvia-percent"
    );


  const preloadOverlay =
    document.getElementById(
      "preload-overlay"
    );


  const preloadBarFill =
    document.getElementById(
      "preload-bar-fill"
    );


  if(
    !canvas ||
    !ctx
  ){
    return;
  }


  /* =====================================================
     FRAME URL
     ===================================================== */

  function frameUrl(index){

    const number =
      String(
        index + 1
      ).padStart(
        CONFIG.padLength,
        "0"
      );


    return (

      CONFIG.frameFolder +

      "/" +

      CONFIG.framePrefix +

      number +

      "." +

      CONFIG.frameExt

    );

  }


  /* =====================================================
     IMAGES
     ===================================================== */

  const images =
    new Array(
      CONFIG.frameCount
    );


  let loadedCount =
    0;


  /* =====================================================
     PRELOAD
     ===================================================== */

  function preloadFrames(){

    return new Promise(
      (resolve)=>{

        for(
          let i=0;
          i<CONFIG.frameCount;
          i++
        ){

          const img =
            new Image();


          img.src =
            frameUrl(i);


          img.onload =
            ()=>{

              loadedCount++;


              const percent =
                Math.round(
                  (
                    loadedCount /
                    CONFIG.frameCount
                  ) * 100
                );


              if(
                preloadBarFill
              ){

                preloadBarFill.style.width =
                  percent + "%";

              }


              if(
                loadedCount ===
                CONFIG.frameCount
              ){

                resolve();

              }

            };


          img.onerror =
            ()=>{

              console.warn(
                "Frame yüklenemedi:",
                img.src
              );


              loadedCount++;


              const percent =
                Math.round(
                  (
                    loadedCount /
                    CONFIG.frameCount
                  ) * 100
                );


              if(
                preloadBarFill
              ){

                preloadBarFill.style.width =
                  percent + "%";

              }


              if(
                loadedCount ===
                CONFIG.frameCount
              ){

                resolve();

              }

            };


          images[i] =
            img;

        }

      }
    );

  }


  /* =====================================================
     STATE
     ===================================================== */

  let currentFrame =
    0;


  let targetFrame =
    0;


  let frameProgress =
    0;


  let dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );


  /* =====================================================
     RESIZE
     ===================================================== */

  function resizeCanvas(){

    dpr =
      Math.min(
        window.devicePixelRatio || 1,
        2
      );


    const rect =
      canvas.getBoundingClientRect();


    canvas.width =
      Math.round(
        rect.width *
        dpr
      );


    canvas.height =
      Math.round(
        rect.height *
        dpr
      );


    ctx.setTransform(
      dpr,
      0,
      0,
      dpr,
      0,
      0
    );


    drawFrame(
      Math.round(
        currentFrame
      )
    );

  }


  /* =====================================================
     DRAW FRAME
     ===================================================== */

  function drawFrame(
    frameIndex
  ){

    const clamped =
      Math.min(
        Math.max(
          frameIndex,
          0
        ),
        images.length - 1
      );


    const img =
      images[clamped];


    if(
      !img ||
      !img.complete ||
      img.naturalWidth === 0
    ){

      return;

    }


    const rect =
      canvas.getBoundingClientRect();


    const cw =
      rect.width;


    const ch =
      rect.height;


    /*
      BEYAZ ZEMİN
    */

    ctx.fillStyle =
      CONFIG.background;


    ctx.fillRect(
      0,
      0,
      cw,
      ch
    );


    /*
      GÖRÜNTÜ KALİTESİ
    */

    ctx.imageSmoothingEnabled =
      true;


    ctx.imageSmoothingQuality =
      "high";


    /*
      GÖRSEL ORANI
    */

    const imageRatio =
      img.naturalWidth /
      img.naturalHeight;


    const canvasRatio =
      cw /
      ch;


    let drawWidth;
    let drawHeight;
    let x;
    let y;


    /*
      COVER
    */

    if(
      canvasRatio >
      imageRatio
    ){

      drawWidth =
        cw;


      drawHeight =
        cw /
        imageRatio;


      x =
        0;


      y =
        (
          ch -
          drawHeight
        ) / 2;

    }

    else{

      drawHeight =
        ch;


      drawWidth =
        ch *
        imageRatio;


      x =
        (
          cw -
          drawWidth
        ) / 2;


      y =
        0;

    }


    /*
      FRAME
    */

    ctx.drawImage(
      img,
      x,
      y,
      drawWidth,
      drawHeight
    );

  }


  /* =====================================================
     PROGRESS
     ===================================================== */

  const WHEEL_SENSITIVITY =
    0.0016;


  function applyProgress(
    value
  ){

    frameProgress =
      Math.min(
        Math.max(
          value,
          0
        ),
        1
      );


    targetFrame =
      frameProgress *
      (
        CONFIG.frameCount - 1
      );


    /*
      OK DOLULUK
      AŞAĞIDAN YUKARI
    */

    if(
      progressFill
    ){

      progressFill.style.height =
        (
          frameProgress *
          100
        ) + "%";

    }


    /*
      YÜZDE
    */

    if(
      percentLabel
    ){

      percentLabel.textContent =
        Math.round(
          frameProgress *
          100
        ) + "%";

    }


    /*
      OK BAŞI
    */

    if(
      arrowHeadFill
    ){

      arrowHeadFill.style.opacity =
        frameProgress > 0.01
          ? "1"
          : "0";

    }

  }


  /* =====================================================
     WHEEL
     ===================================================== */

  function onCanvasWheel(
    event
  ){

    event.preventDefault();


    applyProgress(
      frameProgress +
      (
        event.deltaY *
        WHEEL_SENSITIVITY
      )
    );

  }


  /* =====================================================
     ANIMATION
     ===================================================== */

  function animate(){

    const difference =
      targetFrame -
      currentFrame;


    if(
      Math.abs(
        difference
      ) >
      0.01
    ){

      currentFrame +=
        difference *
        CONFIG.ease;

    }

    else{

      currentFrame =
        targetFrame;

    }


    drawFrame(
      Math.round(
        currentFrame
      )
    );


    requestAnimationFrame(
      animate
    );

  }


  /* =====================================================
     INIT
     ===================================================== */

  async function init(){

    window.addEventListener(
      "resize",
      resizeCanvas,
      {
        passive:true
      }
    );


    canvas.addEventListener(
      "wheel",
      onCanvasWheel,
      {
        passive:false
      }
    );


    resizeCanvas();


    await preloadFrames();


    drawFrame(
      0
    );


    applyProgress(
      0
    );


    animate();


    /*
      PRELOADER KAPAT
    */

    if(
      preloadOverlay
    ){

      preloadOverlay.classList.add(
        "hidden"
      );


      setTimeout(
        ()=>{

          if(
            preloadOverlay
          ){

            preloadOverlay.remove();

          }

        },
        600
      );

    }

  }


  init();

})();

</script>

</body>
</html>
