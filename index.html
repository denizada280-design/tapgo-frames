<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Tapgo 3D Model</title>

<style>

:root {
  --bg:#0e0e0e;
  --fg:#f5f5f0;
  --accent:#d4ff4f;
}

* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body {
  background:var(--bg);
  color:var(--fg);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Inter",
    Arial,
    sans-serif;
  overflow-x:hidden;
}

.scroll-section {
  position:relative;
  height:100vh;
  background:var(--bg);
}

.sticky-wrap {
  position:relative;
  height:100%;
  width:100%;
  overflow:hidden;
  background:var(--bg);
}

#sequence-canvas {
  position:absolute;

  top:50%;
  left:50%;

  transform:
    translate(-50%, -50%);

  height:92vh;

  width:auto;

  max-width:94vw;

  aspect-ratio:478 / 850;

  display:block;

  background:var(--bg);
}

.scroll-copy {
  position:absolute;

  inset:0;

  pointer-events:none;

  z-index:5;
}

.beat {
  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(-50%, -50%);

  text-align:center;

  opacity:0;

  transition:
    opacity .4s ease;

  width:
    min(90%, 640px);
}

.beat.visible {
  opacity:1;
}

.beat h1 {
  font-size:
    clamp(
      2.2rem,
      6vw,
      4.5rem
    );

  font-weight:700;

  letter-spacing:-.02em;

  margin-bottom:12px;
}

.beat h2 {
  font-size:
    clamp(
      1.6rem,
      4vw,
      2.6rem
    );

  font-weight:600;

  margin-bottom:10px;
}

.beat p {
  font-size:
    clamp(
      .95rem,
      1.4vw,
      1.15rem
    );

  opacity:.75;
}

.beat:first-child {
  top:18%;

  transform:
    translate(-50%, 0);
}

.scroll-progress-track {
  position:absolute;

  bottom:32px;
  left:50%;

  transform:
    translateX(-50%);

  width:
    min(60%, 320px);

  height:2px;

  background:
    rgba(
      255,
      255,
      255,
      .15
    );

  border-radius:2px;

  overflow:hidden;

  z-index:5;
}

.scroll-progress-fill {
  height:100%;

  width:0%;

  background:
    var(--accent);
}

.scroll-hint {
  position:absolute;

  bottom:48px;
  left:50%;

  transform:
    translateX(-50%);

  font-size:11px;

  letter-spacing:.15em;

  text-transform:uppercase;

  opacity:.5;

  z-index:5;

  animation:
    bob 1.8s ease-in-out infinite;
}

@keyframes bob {

  0%,
  100% {
    transform:
      translate(-50%, 0);
  }

  50% {
    transform:
      translate(-50%, 6px);
  }

}

#preload-overlay {
  position:fixed;

  inset:0;

  z-index:999;

  background:
    var(--bg);

  display:flex;

  align-items:center;

  justify-content:center;

  transition:
    opacity .5s ease;
}

#preload-overlay
.preload-bar-track {

  width:200px;

  height:2px;

  background:
    rgba(
      255,
      255,
      255,
      .15
    );

  border-radius:2px;

  overflow:hidden;
}

#preload-overlay
.preload-bar-fill {

  height:100%;

  width:0%;

  background:
    var(--accent);
}

#preload-overlay.hidden {

  opacity:0;

  pointer-events:none;
}

</style>
</head>


<body>


<!-- PRELOAD -->

<div id="preload-overlay">

  <div class="preload-bar-track">

    <div
      class="preload-bar-fill"
      id="preload-bar-fill">
    </div>

  </div>

</div>


<!-- =====================================================
     STORY SECTION
     ===================================================== -->

<section
  id="story"
  class="scroll-section">

  <div class="sticky-wrap">


    <!-- FRAME CANVAS -->

    <canvas
      id="sequence-canvas">
    </canvas>


    <!-- TEXT -->

    <div class="scroll-copy">


      <div
        class="beat"
        data-range="0,0.12">

        <h1>
          Introducing PRODUCT
        </h1>

        <p>
          Scroll to see it come alive.
        </p>

      </div>


      <div
        class="beat"
        data-range="0.35,0.55">

        <h2>
          Precision engineered
        </h2>

        <p>
          Every detail, considered.
        </p>

      </div>


      <div
        class="beat"
        data-range="0.75,0.95">

        <h2>
          Made for you
        </h2>

        <p>
          Available now.
        </p>

      </div>


    </div>


    <!-- PROGRESS -->

    <div
      class="scroll-progress-track">

      <div
        class="scroll-progress-fill"
        id="progress-fill">
      </div>

    </div>


    <!-- HINT -->

    <div class="scroll-hint">
      Scroll
    </div>


  </div>

</section>


<script>

(() => {

  "use strict";


  /* =========================================================
     CONFIG
     ========================================================= */

  const CONFIG = {

    /*
      index.html ile resimler aynı klasörde.
    */

    frameFolder: ".",


    /*
      RESİM ADI FORMATIN:

      ezgif-frame-001.jpg
      ezgif-frame-002.jpg
      ezgif-frame-003.jpg
      ...
      ezgif-frame-110.jpg

      Burada xxx kısmını otomatik oluşturuyoruz.
    */

    framePrefix: "ezgif-frame-",

    frameExt: "jpg",

    frameCount: 110,

    padLength: 3,


    /*
      Arka plan
    */

    background:"#0e0e0e",


    /*
      Frame geçiş yumuşaklığı
    */

    ease:0.08

  };


  /* =========================================================
     DOM
     ========================================================= */

  const canvas =
    document.getElementById(
      "sequence-canvas"
    );

  const ctx =
    canvas.getContext(
      "2d"
    );


  const progressFill =
    document.getElementById(
      "progress-fill"
    );


  const preloadOverlay =
    document.getElementById(
      "preload-overlay"
    );


  const preloadBarFill =
    document.getElementById(
      "preload-bar-fill"
    );


  const beats =
    Array.from(
      document.querySelectorAll(
        ".beat"
      )
    );


  canvas.style.background =
    CONFIG.background;


  document.documentElement.style
    .setProperty(
      "--bg",
      CONFIG.background
    );


  /* =========================================================
     FRAME URL OLUŞTURMA
     ========================================================= */

  function frameUrl(index) {

    /*
      0 -> ezgif-frame-001.jpg
      1 -> ezgif-frame-002.jpg
      2 -> ezgif-frame-003.jpg
      ...
      109 -> ezgif-frame-110.jpg
    */

    const number =
      String(index + 1)
        .padStart(
          CONFIG.padLength,
          "0"
        );


    return (
      CONFIG.frameFolder +
      "/" +
      CONFIG.framePrefix +
      number +
      "." +
      CONFIG.frameExt
    );

  }


  /* =========================================================
     IMAGE STORAGE
     ========================================================= */

  const images =
    new Array(
      CONFIG.frameCount
    );


  let loadedCount = 0;


  /* =========================================================
     PRELOAD
     ========================================================= */

  function preloadFrames() {

    return new Promise(
      (resolve) => {

        /*
          Her frame'i yükle
        */

        for(
          let i = 0;
          i < CONFIG.frameCount;
          i++
        ){

          const img =
            new Image();


          /*
            Burada tam olarak:

            ezgif-frame-001.jpg
            ezgif-frame-002.jpg
            ...

            okunuyor.
          */

          img.src =
            frameUrl(i);


          img.onload =
            () => {

              loadedCount++;


              const percent =
                Math.round(
                  (
                    loadedCount /
                    CONFIG.frameCount
                  ) * 100
                );


              if(
                preloadBarFill
              ){

                preloadBarFill.style.width =
                  percent + "%";

              }


              if(
                loadedCount ===
                CONFIG.frameCount
              ){

                resolve();

              }

            };


          img.onerror =
            () => {

              /*
                Hatalı resim olsa bile
                preload kilitlenmesin.
              */

              loadedCount++;


              const percent =
                Math.round(
                  (
                    loadedCount /
                    CONFIG.frameCount
                  ) * 100
                );


              if(
                preloadBarFill
              ){

                preloadBarFill.style.width =
                  percent + "%";

              }


              console.warn(
                "Frame yüklenemedi:",
                img.src
              );


              if(
                loadedCount ===
                CONFIG.frameCount
              ){

                resolve();

              }

            };


          images[i] =
            img;

        }

      }
    );

  }


  /* =========================================================
     CANVAS SCALE
     ========================================================= */

  let dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );


  function resizeCanvas() {

    dpr =
      Math.min(
        window.devicePixelRatio || 1,
        2
      );


    const rect =
      canvas.getBoundingClientRect();


    canvas.width =
      Math.round(
        rect.width * dpr
      );


    canvas.height =
      Math.round(
        rect.height * dpr
      );


    ctx.setTransform(
      dpr,
      0,
      0,
      dpr,
      0,
      0
    );


    drawFrame(
      Math.round(
        currentFrame
      ),
      true
    );

  }


  /* =========================================================
     DRAW FRAME
     ========================================================= */

  function drawFrame(
    frameIndex,
    force
  ){

    const maxIndex =
      images.length - 1;


    const clamped =
      Math.min(
        Math.max(
          frameIndex,
          0
        ),
        maxIndex
      );


    const img =
      images[clamped];


    /*
      Frame henüz yüklenmediyse
      bekle.
    */

    if(
      !img ||
      !img.complete ||
      img.naturalWidth === 0
    ){

      return;

    }


    const rect =
      canvas.getBoundingClientRect();


    const cw =
      rect.width;


    const ch =
      rect.height;


    /*
      Arka plan
    */

    ctx.fillStyle =
      CONFIG.background;


    ctx.fillRect(
      0,
      0,
      cw,
      ch
    );


    ctx.imageSmoothingEnabled =
      true;


    ctx.imageSmoothingQuality =
      "high";


    /*
      COVER FIT
    */

    const imageRatio =
      img.naturalWidth /
      img.naturalHeight;


    const canvasRatio =
      cw / ch;


    let drawWidth;
    let drawHeight;
    let drawX;
    let drawY;


    if(
      canvasRatio >
      imageRatio
    ){

      drawWidth =
        cw;


      drawHeight =
        cw /
        imageRatio;


      drawX =
        0;


      drawY =
        (
          ch -
          drawHeight
        ) / 2;

    }

    else{

      drawHeight =
        ch;


      drawWidth =
        ch *
        imageRatio;


      drawY =
        0;


      drawX =
        (
          cw -
          drawWidth
        ) / 2;

    }


    ctx.drawImage(
      img,
      drawX,
      drawY,
      drawWidth,
      drawHeight
    );

  }


  /* =========================================================
     SCROLL / FRAME PROGRESS
     ========================================================= */

  let frameProgress =
    0;


  let targetFrame =
    0;


  let currentFrame =
    0;


  /*
    Wheel hassasiyeti
  */

  const WHEEL_SENSITIVITY =
    0.0016;


  /* =========================================================
     TEXT BEATS
     ========================================================= */

  function updateBeats(
    progress
  ){

    beats.forEach(
      (beat) => {

        const [
          start,
          end
        ] =
          beat
            .dataset
            .range
            .split(",")
            .map(Number);


        const visible =
          progress >= start &&
          progress <= end;


        beat.classList.toggle(
          "visible",
          visible
        );

      }
    );

  }


  /* =========================================================
     APPLY PROGRESS
     ========================================================= */

  function applyProgress(
    progress
  ){

    frameProgress =
      Math.min(
        Math.max(
          progress,
          0
        ),
        1
      );


    targetFrame =
      frameProgress *
      (
        CONFIG.frameCount - 1
      );


    progressFill.style.width =
      (
        frameProgress *
        100
      ) + "%";


    updateBeats(
      frameProgress
    );

  }


  /* =========================================================
     CANVAS WHEEL
     ========================================================= */

  function onCanvasWheel(
    event
  ){

    /*
      Canvas üzerindeyken
      sayfa scroll yerine
      frame değiştir.
    */

    event.preventDefault();


    applyProgress(
      frameProgress +
      event.deltaY *
      WHEEL_SENSITIVITY
    );

  }


  /* =========================================================
     ANIMATION LOOP
     ========================================================= */

  function animate(){

    const diff =
      targetFrame -
      currentFrame;


    if(
      Math.abs(diff) >
      0.01
    ){

      currentFrame +=
        diff *
        CONFIG.ease;

    }

    else{

      currentFrame =
        targetFrame;

    }


    drawFrame(
      Math.round(
        currentFrame
      )
    );


    requestAnimationFrame(
      animate
    );

  }


  /* =========================================================
     INIT
     ========================================================= */

  async function init(){

    /*
      Resize
    */

    window.addEventListener(
      "resize",
      resizeCanvas,
      {
        passive:true
      }
    );


    /*
      Wheel
    */

    canvas.addEventListener(
      "wheel",
      onCanvasWheel,
      {
        passive:false
      }
    );


    /*
      Canvas boyutlandır
    */

    resizeCanvas();


    /*
      Frame'leri yükle
    */

    await preloadFrames();


    /*
      İlk frame
    */

    drawFrame(
      0,
      true
    );


    /*
      Başlangıç
    */

    applyProgress(
      0
    );


    /*
      Animasyon başlat
    */

    animate();


    /*
      Loading ekranını kapat
    */

    preloadOverlay.classList.add(
      "hidden"
    );


    setTimeout(
      () => {

        if(
          preloadOverlay
        ){

          preloadOverlay.remove();

        }

      },
      600
    );

  }


  init();

})();

</script>

</body>
</html>
